# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml  –  KOC Revenue Management (Production)
#
# Lần đầu deploy (SSL):
#   chmod +x scripts/init-letsencrypt.sh && ./scripts/init-letsencrypt.sh
#
# Sau đó:
#   docker compose up --build -d
#
# Frontend:   https://koc-scraper.com
# Backend API: https://koc-scraper.com/api  (proxy qua nginx)
# PostgreSQL:  localhost:5432 (nội bộ)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-koc_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Express + Prisma + Puppeteer) ─────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Override DATABASE_URL so it points to the 'db' service inside Docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-koc_db}
      PORT: 3001
      NODE_ENV: production
      # Allow requests from the production domain
      CORS_ORIGIN: https://koc-scraper.com,https://www.koc-scraper.com
    env_file:
      # All other secrets (JWT_SECRET, GMAIL_*, etc.) come from server/.env
      - ./server/.env
    ports:
      - "3001:3001"   # giữ để debug trực tiếp; xóa để chỉ cho nginx proxy
    volumes:
      # Persist Chrome session data across container restarts
      - chrome_data:/app/.chrome-data
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (Vite build → nginx nội bộ) ────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Vite bật tại build time – dùng URL tương đối để nginx proxy /api
        VITE_API_URL: /api
        VITE_SERVER_URL: https://koc-scraper.com
    restart: unless-stopped
    # Không expose ra ngoài – nginx proxy mới tiếp nhận
    expose:
      - "80"
    depends_on:
      - server

  # ── Nginx Reverse Proxy (SSL termination) ─────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - client
      - server

  # ── Certbot (Let's Encrypt auto-renewal) ────────────────
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Kiểm tra gia hạn mỗi 12 giờ
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  chrome_data:
