# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml  –  KOC Revenue Management (Production)
#
# Lần đầu deploy (SSL):
#   chmod +x scripts/init-letsencrypt.sh && ./scripts/init-letsencrypt.sh
#
# Sau đó:
#   docker compose up --build -d
#
# Frontend:   https://koc-scraper.com
# Backend API: https://koc-scraper.com/api  (proxy qua nginx)
# PostgreSQL:  localhost:5432 (nội bộ)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-koc_db}
    ports:
      - "5434:5432"   # 5432 và 5433 đã dùng bởi service khác
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Express + Prisma + Puppeteer) ─────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Override DATABASE_URL so it points to the 'db' service inside Docker
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-koc_db}
      PORT: 3002
      NODE_ENV: production
      # Allow requests from IP:port trực tiếp
      CORS_ORIGIN: http://46.62.170.132:8080
    env_file:
      # Secrets từ .env.production (SMTP, JWT, etc.)
      - ./server/.env.production
    ports:
      - "3002:3002"   # System nginx sẽ proxy /api → port này
      - "6080:6080"   # noVNC web interface (đăng nhập YouTube Studio qua trình duyệt)
    volumes:
      # Persist Chrome session data across container restarts (bind mount for easy sync)
      - ./server/.chrome-data:/app/.chrome-data
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (Vite build → nginx nội bộ) ────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Trỏ thẳng vào IP:port của server, không qua proxy
        VITE_API_URL: /api
        VITE_SERVER_URL:
    restart: unless-stopped
    ports:
      - "8181:80"   # Truy cập qua tunnel port 8181
    depends_on:
      - server

volumes:
  postgres_data:
