# ─────────────────────────────────────────────────────────────
# nginx/default.conf  –  Reverse Proxy for koc-scraper.com
# ─────────────────────────────────────────────────────────────

# ── HTTP: ACME challenge + redirect to HTTPS ─────────────────
server {
    listen 80;
    server_name koc-scraper.com www.koc-scraper.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main production server ────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name koc-scraper.com www.koc-scraper.com;

    # Let's Encrypt certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/koc-scraper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koc-scraper.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── API → Backend server ────────────────────────────────
    location /api/ {
        proxy_pass         http://server:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         'upgrade';
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s; # 10 min (for long scraping)
        proxy_send_timeout 600s;
    }

    # ── Frontend → Client (built by Vite, served by nginx) ──
    location / {
        proxy_pass        http://client:80;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
    }
}
